generator_version: 1
map_size: 10.0
budget: 15.0
margin: 0.3
weights: [1, 10]
depot_edge_dist: 1.0
depot_min_sep: 3.0
nfz:
  max_count: 3
  vertices: [5, 8]
  radius: [0.8, 2.0]
  area_fraction: [0.05, 0.20]
clustered:
  centres: [3, 6]
  sigma: [0.4, 1.0]
corridor:
  polylines: [1, 3]
  vertices: [3, 5]
  sigma: 0.25
validation:
  depot_nfz_clearance: 0.2
  target_nfz_clearance: 0.05
  min_target_sep: 0.001
  max_repairs: 20
splits:
  smoke:         {count: 5,   n: 20,  k: 2, seed_start: 9000}
  small_test:    {count: 20,  n: 50,  k: 3, seed_start: 1000}
  test:          {count: 100, n: 50,  k: 3, seed_start: 1000}
  test_small_n:  {count: 30,  n: 20,  k: 3, seed_start: 4000}
  test_large:    {count: 50,  n: 100, k: 3, seed_start: 2000}
